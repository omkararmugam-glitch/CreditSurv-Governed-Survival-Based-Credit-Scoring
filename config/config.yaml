# creditsurv pipeline configuration
#
# Fill in the two csv paths below, then run scripts/00_ingest.py.
# Everything else has a working default.

paths:
  # >>> SET THESE TO YOUR DOWNLOADED KAGGLE FILES <<<
  accepted_csv: outputs/data/accepted_2007_to_2018Q4.csv
  rejected_csv: outputs/data/rejected_2007_to_2018Q4.csv

  data_dir: outputs/data
  models_dir: outputs/models
  figures_dir: outputs/figures
  tables_dir: outputs/tables
  registry: config/models.yaml   # which models may score for lending decisions

ingest:
  chunksize: 250000
  extended_features: true
  row_limit: null       # set e.g. 50000 to smoke-test ingest on the real file

sample:
  dev_sample_size: 200000
  stratify_by: [issue_year, term_months]
  seed: 20260921

# Survival-label construction. These defaults ARE the primary specification
# documented in FINDINGS.md. Changing them changes every downstream result.
label:
  late_31_120_is_event: false       # sensitivity variant: true
  include_policy_exceptions: false  # 2007-08 loans under a different regime
  min_duration_months: 1
  term_overrun_grace_months: 12
  event_lag_months: 0               # sensitivity variant: 5 (LC charge-off lag)
  data_cutoff: null                 # null => inferred from the data

model:
  with_lc_grade: false              # primary excludes LC grade / sub_grade / int_rate
  test_size: 0.2
  time_bin_months: 1                # use 3 for the full-data run
  eval_horizons_months: [6, 12, 18, 24, 30, 36]
  seed: 20260921

explain:
  n_explain: 1000
  n_background: 100
  kernel_nsamples: 600   # measured stability floor for 73 features; see
                         # outputs/tables/03_nsamples_study.csv
  segment_by: [grade, purpose, income_band]
  seed: 20260921

# Pre-registered Stage 4 gate thresholds. Fixed before looking at any result.
diagnostic:
  rejected_sample_size: 1000000
  smd_notable: 0.10
  smd_substantial: 0.25
  ks_substantial: 0.20
  separability_auc_strong: 0.75
  separability_auc_weak: 0.60
  min_common_support: 0.05
  seed: 20260921

# Cleaning rules, applied by creditsurv/cleaning.py to BOTH training and
# dashboard scoring. Defaults are v1-parity: the rule set the current trained
# models were produced under. Every switch below that is false would change a
# model input, so turning one on invalidates the fitted models and requires a
# retrain plus a note in FINDINGS saying which results used which version.
cleaning:
  version: v1-parity
  coerce_numeric_text: true    # "$85,000" / "45.6%" -> numbers, as ingest does
  align_categories: true       # map categories onto the training levels
  unseen_category_to_other: false   # false = unseen level becomes missing + counted
  rare_category_min_count: 0        # 0 = no rare-level pooling
  clip_numeric: false               # false = nothing is clipped, only flagged
  clip_quantiles: [0.001, 0.999]    # bounds used only if clip_numeric is true
  range_quantiles: [0.005, 0.995]   # bounds for FLAGGING out-of-range values
  drop_duplicate_ids: false         # false = duplicates counted and kept

# Approve/reject policy for the Score Applicants dashboard. This is a POLICY
# choice, not a model output: the survival model returns a probability.
# reject_at_or_above 0.30 on the full model's test split declines 17.0% of
# applicants, taking the approved population's observed default rate from
# 11.8% to 8.9% (rejected: 25.9%). Shown on the dashboard and written into
# every run_summary.csv.
decision:
  # Must be approved in config/models.yaml, or scoring refuses. "full" is
  # deprecated (FINDINGS 7c defect, uses addr_state); see FINDINGS 7l.
  model_tag: full_applicant_nogeo
  model: discrete_hazard     # or cox
  horizon_months: 36
  reject_at_or_above: 0.30
  explain_nsamples: 600      # ~2.7s per explained applicant
  explain_n_background: 100
  max_explained: 0           # 0 = no cap: every rejected applicant is explained
  explain_workers: 0         # 0 = pick from cores and free memory
  background_rows: 20000
  background_above_mb: 25     # uploads >= this run in a background process
  bulk_explainer: survshap    # survshap | treeshap | auto (see FINDINGS section 7)
  chunk_rows: 50000           # rows per block; peak memory follows this, not file size
  drift_min_rows: 500         # below this, drift is reported as 'too few rows'
  min_feature_coverage: 0.60
  # Fail the run if a model feature in the file is unreadable for more than this
  # share of rows, or missing for this much more than it was in training.
  input_quality_max_share: 0.05
  # Share of rejections where a non-disclosable feature was a top adverse driver,
  # above which the dashboard asks for fair-lending review (FINDINGS 7l).
  fair_lending_review_share: 0.05
  # Phase 2 (reasons, notices) starts by itself for at most this many rejected
  # applicants; above it the dashboard asks: all, a random sample, or skip.
  explain_confirm_above: 1000
  explain_seconds_each: 2.1        # for the ETA shown before Phase 2 starts
  phase2_checkpoint_seconds: 20    # how often reasons are written while it runs
